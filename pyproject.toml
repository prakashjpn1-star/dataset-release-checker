[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-release-checker"
version = "0.1.0"
description = "Validate CSV releases against published column schemas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
dataset-check = "dataset_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
